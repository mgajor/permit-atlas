name: Build verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: permit-atlas-${{ matrix.os }}-unpacked
          path: |
            release/mac*/
            release/win-unpacked/
            release/linux-unpacked/
          if-no-files-found: error
          retention-days: 7
